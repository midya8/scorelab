<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760">
<rect width="1120" height="760" fill="#101827"/>
<style>text{font-family:Arial,sans-serif;fill:#e7edf8}</style>
<metadata data-encoding="zlib+base64"></metadata>
<text x="30.00000000" y="44.00000000" font-size="26" style="fill:#e7edf8">ScoreLab | matrix score controls go beyond a scalar baseline</text>
<text x="30.00000000" y="80.00000000" font-size="18" style="fill:#e7edf8">Exact finite-model distributions. Same correct mean; a larger control class.</text>
<text x="55.00000000" y="126.00000000" font-size="19" style="fill:#e7edf8">One step, three actions, two score coordinates</text>
<text x="55.00000000" y="156.00000000" font-size="16" style="fill:#b7c4d9">Action probabilities: 1/6, 1/3, 1/2. Rewards: 0, 1, 2.</text>
<path d="M 70 420.00000000 H 550" stroke="#33445e"/>
<text x="28.00000000" y="425.00000000" font-size="14" style="fill:#b7c4d9">0.0</text>
<path d="M 70 339.00000000 H 550" stroke="#33445e"/>
<text x="28.00000000" y="344.00000000" font-size="14" style="fill:#b7c4d9">0.3</text>
<path d="M 70 258.00000000 H 550" stroke="#33445e"/>
<text x="28.00000000" y="263.00000000" font-size="14" style="fill:#b7c4d9">0.6</text>
<path d="M 70 177.00000000 H 550" stroke="#33445e"/>
<text x="28.00000000" y="182.00000000" font-size="14" style="fill:#b7c4d9">0.9</text>
<rect data-estimator="reward_to_go" x="94" y="195.83333333" width="48" height="224.16666667" fill="#98a8c0"/>
<text x="92.00000000" y="449.00000000" font-size="16" style="fill:#e7edf8">None</text>
<text x="92.00000000" y="183.83333333" font-size="16" style="fill:#98a8c0">0.8302</text>
<rect data-estimator="value_baseline" x="213" y="395.83333333" width="48" height="24.16666667" fill="#98a8c0"/>
<text x="211.00000000" y="449.00000000" font-size="16" style="fill:#e7edf8">Value</text>
<text x="211.00000000" y="383.83333333" font-size="16" style="fill:#98a8c0">0.0895</text>
<rect data-estimator="optimal_baseline" x="332" y="396.61764706" width="48" height="23.38235294" fill="#e9bb79"/>
<text x="330.00000000" y="449.00000000" font-size="16" style="fill:#e7edf8">Scalar</text>
<text x="330.00000000" y="384.61764706" font-size="16" style="fill:#e9bb79">0.0866</text>
<rect data-estimator="optimal_linear" x="451" y="420.00000000" width="48" height="0.00000000" fill="#63d8bc"/>
<text x="449.00000000" y="449.00000000" font-size="16" style="fill:#e7edf8">Matrix</text>
<text x="449.00000000" y="408.00000000" font-size="16" style="fill:#63d8bc">0.0000</text>
<text x="55.00000000" y="482.00000000" font-size="16" style="fill:#b7c4d9">Vertical axis: trace covariance (gradient variance sum).</text>
<text x="610.00000000" y="126.00000000" font-size="19" style="fill:#e7edf8">A full matrix, not one number per node</text>
<text x="610.00000000" y="168.00000000" font-size="21" style="fill:#63d8bc">G_B = G_RTG - B Z</text>
<text x="610.00000000" y="216.00000000" font-size="23" style="fill:#e7edf8">B = [  2/3    -2/3 ]</text>
<text x="610.00000000" y="251.00000000" font-size="23" style="fill:#e7edf8">       [ -1/2       1 ]</text>
<text x="610.00000000" y="295.00000000" font-size="17" style="fill:#e7edf8">Every action gives the exact gradient:</text>
<text x="610.00000000" y="332.00000000" font-size="25" style="fill:#63d8bc">[-1/9, 1/3]</text>
<text x="610.00000000" y="376.00000000" font-size="18" style="fill:#e7edf8">Covariance = the zero 2 x 2 matrix.</text>
<text x="610.00000000" y="414.00000000" font-size="17" style="fill:#e7edf8">Best scalar trace: 53/612. Best matrix: 0.</text>
<text x="610.00000000" y="452.00000000" font-size="15" style="fill:#b7c4d9">Supplied fixture, not a universal zero-variance claim.</text>
<text x="30.00000000" y="530.00000000" font-size="22" style="fill:#e7edf8">Singular controls are handled without a fake inverse</text>
<text x="30.00000000" y="568.00000000" font-size="17" style="fill:#e7edf8">Separate 64-path, three-step model: node score ranks = [1, 0, 1, 1, 1, 1].</text>
<text x="30.00000000" y="600.00000000" font-size="17" style="fill:#e7edf8">Scalar-optimal trace: 1.462519. Matrix-optimal trace: 1.460918. This improvement is small.</text>
<text x="30.00000000" y="638.00000000" font-size="17" style="fill:#63d8bc">B* S = C, solved by exact rational RREF. Cov(B) - Cov(B*) = sum (B-B*) S (B-B*)^T.</text>
<text x="30.00000000" y="674.00000000" font-size="16" style="fill:#e7edf8">Each gap term is positive semidefinite. Singular coefficients can differ; supported corrections cannot.</text>
<text x="30.00000000" y="712.00000000" font-size="16" style="fill:#b7c4d9">Optimal only within fixed time/state matrix-score controls for reward-to-go. No fitted critic or training trials.</text>
<text x="30.00000000" y="744.00000000" font-size="16" style="fill:#b7c4d9">Full exact distributions, normal equations and covariance certificates are embedded in SVG metadata.</text>
</svg>
