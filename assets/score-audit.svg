<metadata data-encoding="zlib+base64"></metadata>
<text x="30" y="44" font-size="26" style="fill:#e7edf8">ScoreLab | a correct value baseline can make gradients noisier</text>
<text x="30" y="80" font-size="18" style="fill:#e7edf8">Exact finite-policy distributions. All estimators have the same correct mean gradient.</text>
<text x="65" y="127" font-size="19" style="fill:#e7edf8">One-step Bernoulli policy: p(action 1) = 4/5</text>
<text x="610" y="127" font-size="19" style="fill:#e7edf8">Separate three-step, two-state shared policy</text>
<text x="65" y="158" font-size="17" style="fill:#b7c4d9">Scalar gradient variance; reward = action</text>
<text x="610" y="158" font-size="17" style="fill:#b7c4d9">Trace covariance; two shared parameters</text>
<path d="M 80 455 H 505" stroke="#33445e"/>
<text x="32" y="460" font-size="15" style="fill:#b7c4d9">0</text>
