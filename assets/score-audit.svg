<text x="777" y="488" font-size="17" style="fill:#e7edf8">RTG</text>
<text x="777" y="354.70202501" font-size="16" style="fill:#98a8c0">2.2574</text>
<rect data-model="sequential" data-estimator="value_baseline" x="885" y="391.908010333" width="48" height="63.091989667" fill="#e9bb79"/>
<text x="882" y="488" font-size="17" style="fill:#e7edf8">Value</text>
<text x="882" y="381.908010333" font-size="16" style="fill:#e9bb79">1.5773</text>
<rect data-model="sequential" data-estimator="optimal_baseline" x="990" y="396.499246171" width="48" height="58.500753829" fill="#63d8bc"/>
<text x="987" y="488" font-size="17" style="fill:#e7edf8">Optimal</text>
<text x="987" y="386.499246171" font-size="16" style="fill:#63d8bc">1.4625</text>
<text x="65" y="535" font-size="17" style="fill:#e7edf8">No baseline: 4/625. Value: 36/625. Optimal: 0.</text>
<text x="65" y="568" font-size="18" style="fill:#e9bb79">The value baseline is NINE times noisier here.</text>
<text x="65" y="600" font-size="16" style="fill:#e7edf8">Value baseline 4/5; variance-minimizing baseline 1/5.</text>
<text x="610" y="535" font-size="16" style="fill:#e7edf8">Full = full return; RTG = reward-to-go, no baseline.</text>
<text x="610" y="568" font-size="17" style="fill:#63d8bc">Optimal minimizes trace variance within scalar</text>
<text x="610" y="596" font-size="17" style="fill:#63d8bc">time/state baselines for the RTG estimator only.</text>
<text x="30" y="645" font-size="18" style="fill:#e7edf8">One-step true gradient: 4/25. The optimal-baseline estimator equals 4/25 for BOTH actions.</text>
<text x="30" y="680" font-size="17" style="fill:#e7edf8">Complete path enumeration + exact rational means, covariances, score energies and baseline normal equations.</text>
<text x="30" y="718" font-size="16" style="fill:#b7c4d9">Separate models and separate vertical scales. Labels are rounded; full exact fractions are in SVG metadata.</text>
<text x="30" y="754" font-size="16" style="fill:#b7c4d9">Not training trials, empirical confidence intervals, a universal baseline ranking or a large-scale RL method.</text>
</svg>
